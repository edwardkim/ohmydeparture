name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config qt6-base-dev qt6-base-dev-tools python3 binutils fonts-noto-cjk xvfb xauth libxcb-cursor0 desktop-file-utils
      - name: Build and test
        run: make -j2 test
      - name: Package and test installer lifecycle
        run: make test-omarchy
      - name: Test native Qt windows
        run: xvfb-run -a -s '-screen 0 1920x1080x24' env QT_QPA_PLATFORM=xcb QT_QPA_PLATFORMTHEME= QT_IM_MODULE= .build/linux/codex-smoke
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarchy-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omarchy-linux-x86_64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --title "Oh My Departure $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
